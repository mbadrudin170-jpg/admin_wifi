name: admin_wifi
description: "Aplikasi untuk mengelola pelanggan Wifi."
publish_to: "none"

version: 1.1.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^6.3.0
  collection: ^1.19.1
  connectivity_plus: ^7.1.1
  device_info_plus: ^12.4.0
  firebase_core: ^4.7.0
  flutter_local_notifications: ^20.1.0
  flutter_riverpod: ^3.4.2
  fluttertoast: ^10.0.2
  font_awesome_flutter: ^11.0.0
  freezed_annotation: ^3.1.0
  google_fonts: ^6.3.2
  intl: ^0.20.2
  jiffy: ^6.4.4
  json_annotation: ^4.11.0
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  pub_semver: ^2.2.0
  riverpod_annotation: ^4.0.8
  # ditambahkan: logger L + infra debug (overlay log) dari paket bersama
  share_global_saya:
    path: ../share_global_saya
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0+3
  sqflite_common_ffi_web: ^1.2.2
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  dependency_validator: ^5.0.5
  mockito: ^5.6.4
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.1.0+1
  freezed: ^4.0.2
  json_serializable: ^6.13.2
  # ditambahkan: Karena dibutuhkan oleh mock exception di form_paket_test.dart
  sqflite_common: ^2.5.4
  fake_async: ^1.3.3
  riverpod_generator: ^4.0.10

# ditambahkan: untuk konfigurasi flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icons"
  # diubah: karena hanya akan membuat ikon untuk Android
  ios: false

  image_path: "assets/logo/ikon/ikon_apk.png"

flutter:
  uses-material-design: true

  assets:
    # diubah: Mendaftarkan folder logo ikon & splash screen secara spesifik
    - assets/logo/ikon/
