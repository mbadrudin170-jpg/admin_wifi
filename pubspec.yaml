name: admin_wifi
description: "Aplikasi untuk mengelola pelanggan Wifi."
publish_to: 'none'

version: 1.1.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.2
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.3
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  shared_preferences: ^2.5.5
  package_info_plus: ^9.0.1
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.2
  font_awesome_flutter: ^11.0.0
  jiffy: ^6.4.4
  device_info_plus: ^12.4.0
  fluttertoast: ^9.0.0
  sqflite_common_ffi: ^2.4.0+3
  pub_semver: ^2.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  dependency_validator: ^5.0.5
  mockito: ^5.6.4
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.1.0+1
  freezed: ^3.2.5
  json_serializable: ^6.13.2

# ditambahkan: untuk konfigurasi flutter_launcher_icons
flutter_launcher_icons:
  android: 'launcher_icons'
  # diubah: karena hanya akan membuat ikon untuk Android
  ios: false 
  
  image_path: "assets/logo/ikon/ikon_apk.png"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    # diubah: Mendaftarkan folder logo ikon & splash screen secara spesifik
    - assets/logo/ikon/
    
    - assets/logo/splash_screen/

  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald.ttf
          weight: 400
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans.ttf
